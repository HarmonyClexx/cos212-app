name: ariadne

# Dev:   docker compose up -d db          -> Postgres only (run API + web locally)
# Full:  docker compose --profile full up --build  -> db + api + web, open http://localhost:4750

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ariadne
      POSTGRES_PASSWORD: ariadne
      POSTGRES_DB: ariadne
    ports:
      - "127.0.0.1:5750:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ariadne -d ariadne"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    profiles: ["full"]
    build: ./backend
    environment:
      ARIADNE_DATABASE_URL: postgresql+psycopg://ariadne:ariadne@db:5432/ariadne
      ARIADNE_JWT_SECRET: ${ARIADNE_JWT_SECRET:-change-me-in-production}
      ARIADNE_UNLOCK_ALL: ${ARIADNE_UNLOCK_ALL:-true}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8750:8750"

  web:
    profiles: ["full"]
    build: ./frontend
    depends_on:
      - api
    ports:
      - "127.0.0.1:4750:80"

volumes:
  pgdata:
